name: Screenshots

# Снимки всех экранов (Paparazzi) — чтобы проверить дизайн без телефона.
# Картинки складываются в ветку «screenshots».

on:
  push:
    branches: ["ui-*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Record screenshots
        run: |
          chmod +x gradlew
          ./gradlew recordPaparazziDebug -Pshots --stacktrace

      - name: Publish to branch «screenshots»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/shots && cp app/src/test/snapshots/images/*.png /tmp/shots/
          cd /tmp/shots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Screenshots of ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots
